<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Once Upon a Dish</title>
<meta name="description" content="The menu of Once Upon a Dish, laid out on a map of stories. Where every dish tells a story.">
<meta name="theme-color" content="#ecdfbd">

<meta property="og:title" content="Once Upon a Dish">
<meta property="og:description" content="Where every dish tells a story.">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

<!-- =====================================================  1 · APERTURA  -->
<div id="stage">
  <span class="paper" aria-hidden="true"></span>
  <span class="paper__fold" aria-hidden="true"></span>
  <span class="grain" aria-hidden="true"></span>
  <span class="paper__edge" aria-hidden="true"></span>
  <span class="paper__gutter" aria-hidden="true"></span>

  <!-- il selettore di lingua, discreto ma sempre in vista -->
  <div class="lang lang--cover" id="coverLang" role="group" aria-label="Language / Lingua"></div>

  <div class="intro__inner">
    <img class="brand" src="assets/img/logo.webp" width="800" height="800"
         alt="Once Upon a Dish" fetchpriority="high">
    <p class="tagline">Where every dish tells a story.</p>
    <p class="seal__hint" id="sealHint"><span></span></p>

    <button id="seal" class="seal" type="button">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <defs>
          <linearGradient id="au" gradientUnits="userSpaceOnUse" x1="60" y1="8" x2="60" y2="112">
            <stop offset="0%"   stop-color="#e3c37e"/>
            <stop offset="45%"  stop-color="#b8912f"/>
            <stop offset="100%" stop-color="#7d5f1c"/>
          </linearGradient>
        </defs>
        <circle class="seal__disc" cx="60" cy="60" r="46"/>
        <circle cx="60" cy="60" r="46" fill="none" stroke="url(#au)" stroke-width="1.6"/>
        <circle cx="60" cy="60" r="41" fill="none" stroke="url(#au)" stroke-width="2.6"/>
        <circle cx="60" cy="60" r="36" fill="none" stroke="url(#au)" stroke-width=".8" opacity=".8"/>
        <g stroke="url(#au)" stroke-width=".9">
          <path d="M60 14v5M60 101v5M14 60h5M101 60h5M27.5 27.5l3.5 3.5M89 89l3.5 3.5M92.5 27.5L89 31M31 89l-3.5 3.5"/>
        </g>
        <g fill="none" stroke="url(#au)" stroke-width="2.2" stroke-linecap="round">
          <circle cx="60" cy="47" r="7.5"/>
          <path d="M60 54.5V80"/>
          <path d="M60 69h8M60 75.5h6"/>
        </g>
        <g fill="url(#au)" opacity=".85">
          <path d="M40 57.5l1.4 2.5-1.4 2.5-1.4-2.5z"/>
          <path d="M80 57.5l1.4 2.5-1.4 2.5-1.4-2.5z"/>
        </g>
      </svg>
    </button>

    <!-- la freccia: invita a scorrere, e porta al menu come il sigillo -->
    <button id="cue" class="cue" type="button">
      <svg viewBox="0 0 26 15" fill="none" stroke="currentColor" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M1.7 1.9 13 12.3 24.3 1.9"/>
      </svg>
    </button>
  </div>
</div>

<!-- ==================================================  LA PAGINA APERTA  -->
<div id="paper" aria-hidden="true">
  <span class="paper"></span>
  <span class="paper__fold"></span>
  <svg id="map" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"></svg>
  <span class="grain"></span>
  <span class="paper__edge"></span>
  <span class="paper__gutter"></span>
</div>

<!-- =======================================================  CONTENUTO  -->
<div id="doc">
  <header class="bar" id="bar"></header>
  <main id="view"></main>
</div>

<!-- ============================================  EASTER EGG + SCHEDA  -->
<div id="tip" role="status" aria-live="polite"></div>

<div id="dish" role="dialog" aria-modal="true" aria-labelledby="dishTitle" hidden>
  <div class="dish-veil"></div>
  <article class="card" id="dishCard"></article>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/map.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
